name: Sync and Encrypt Master Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# กันรันซ้อนกัน: ถ้ารอบก่อนยังไม่จบ รอบใหม่จะรอคิว
concurrency:
  group: sync-master-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and Encrypt Data
        env:
          GAS_EXPORTER_URL: ${{ secrets.GAS_EXPORTER_URL }}
          MASTER_PASSPHRASE: ${{ secrets.MASTER_PASSPHRASE }}
        run: |
          cat > "$RUNNER_TEMP/export-encrypt.js" <<'EOF'
          "use strict";
          const crypto = require("crypto");
          const fs = require("fs");
          const https = require("https");

          const MAX_REDIRECTS = 10;
          const MAX_RETRIES = 3;
          const TIMEOUT_MS = 30000;
          const ITERATIONS = 100000;

          function fail(msg) {
            console.error("ERROR: " + msg);
            process.exit(1);
          }

          // ทำความสะอาดค่า URL: ตัด BOM/ช่องว่าง/เครื่องหมายคำพูด, ดึงเฉพาะ URL,
          // เติม https:// ให้ถ้าขาด, และแปลง Deployment ID เป็น URL เต็มให้
          function normalizeUrl(raw) {
            let v = String(raw || "").replace(/^\uFEFF/, "").trim();
            if (!v) {
              fail("GAS_EXPORTER_URL ว่าง - ตรวจชื่อและค่า Secret ใน Settings > Secrets and variables > Actions");
            }
            const m = v.match(/https?:\/\/[^\s"'<>]+/i);
            if (m) {
              v = m[0];
            } else if (/^script\.google\.com\//i.test(v)) {
              v = "https://" + v;
            } else if (/^[A-Za-z0-9_-]{20,}$/.test(v)) {
              v = "https://script.google.com/macros/s/" + v + "/exec";
            }
            let u;
            try {
              u = new URL(v);
            } catch (e) {
              fail("GAS_EXPORTER_URL ไม่ใช่ URL ที่ถูกต้อง (ความยาวค่า " + v.length + " ตัวอักษร) - ต้องเป็น https://script.google.com/macros/s/.../exec");
            }
            if (u.protocol !== "https:") fail("GAS_EXPORTER_URL ต้องเป็น https:// เท่านั้น");
            return u.href;
          }

          function fetchOnce(target, redirects) {
            return new Promise(function (resolve, reject) {
              if (redirects > MAX_REDIRECTS) {
                return reject(Object.assign(new Error("redirect เกิน " + MAX_REDIRECTS + " ครั้ง"), { fatal: true }));
              }
              const req = https.get(target, { headers: { "User-Agent": "sync-data/1.0" } }, function (res) {
                const code = res.statusCode || 0;
                if (code >= 300 && code < 400 && res.headers.location) {
                  res.resume();
                  let next;
                  try {
                    next = new URL(res.headers.location, target).href;
                  } catch (e) {
                    return reject(Object.assign(new Error("Location header ไม่ถูกต้อง"), { fatal: true }));
                  }
                  return resolve(fetchOnce(next, redirects + 1));
                }
                if (code !== 200) {
                  res.resume();
                  const retryable = code >= 500 || code === 429;
                  return reject(Object.assign(new Error("HTTP " + code), { fatal: !retryable }));
                }
                const chunks = [];
                res.on("data", function (c) { chunks.push(c); });
                res.on("end", function () { resolve(Buffer.concat(chunks).toString("utf8")); });
                res.on("error", reject);
              });
              req.setTimeout(TIMEOUT_MS, function () { req.destroy(new Error("timeout")); });
              req.on("error", reject);
            });
          }

          async function fetchWithRetry(url) {
            let lastErr;
            for (let i = 1; i <= MAX_RETRIES; i++) {
              try {
                return await fetchOnce(url, 0);
              } catch (err) {
                lastErr = err;
                if (err.fatal || i === MAX_RETRIES) break;
                console.warn("ครั้งที่ " + i + " ล้มเหลว (" + err.message + ") - ลองใหม่");
                await new Promise(function (r) { setTimeout(r, 2000 * i); });
              }
            }
            throw lastErr;
          }

          function encrypt(plain, password) {
            const salt = crypto.randomBytes(16);
            const iv = crypto.randomBytes(12);
            const key = crypto.pbkdf2Sync(password, salt, ITERATIONS, 32, "sha256");
            const cipher = crypto.createCipheriv("aes-256-gcm", key, iv);
            let ciphertext = cipher.update(plain, "utf8", "hex");
            ciphertext += cipher.final("hex");
            return {
              salt: salt.toString("hex"),
              iv: iv.toString("hex"),
              authTag: cipher.getAuthTag().toString("hex"),
              ciphertext: ciphertext
            };
          }

          function verify(p, password, expected) {
            const key = crypto.pbkdf2Sync(password, Buffer.from(p.salt, "hex"), ITERATIONS, 32, "sha256");
            const d = crypto.createDecipheriv("aes-256-gcm", key, Buffer.from(p.iv, "hex"));
            d.setAuthTag(Buffer.from(p.authTag, "hex"));
            let out = d.update(p.ciphertext, "hex", "utf8");
            out += d.final("utf8");
            return out === expected;
          }

          async function main() {
            const password = String(process.env.MASTER_PASSPHRASE || "").replace(/^\uFEFF/, "").trim();
            if (!password) fail("MASTER_PASSPHRASE ว่าง - ตรวจ Secret ใน Settings > Secrets and variables > Actions");

            const url = normalizeUrl(process.env.GAS_EXPORTER_URL);
            console.log("กำลังดึงข้อมูลจาก Google Apps Script ...");

            const body = (await fetchWithRetry(url)).replace(/^\uFEFF/, "").trim();
            if (!body) fail("GAS ตอบกลับเป็นค่าว่าง");
            if (/^<(!doctype|html)/i.test(body)) {
              fail("GAS ตอบกลับเป็นหน้า HTML (น่าจะเป็นหน้า login/error ของ Google) - ตรวจว่า Deploy เป็น Web App และตั้ง Who has access เป็น Anyone");
            }
            let parsed;
            try {
              parsed = JSON.parse(body);
            } catch (e) {
              fail("ข้อมูลจาก GAS ไม่ใช่ JSON ที่ถูกต้อง - ตรวจว่า GAS_EXPORTER_URL ลงท้าย /exec?token=รหัสลับ");
            }
            if (parsed && !Array.isArray(parsed) && parsed.error) {
              fail("GAS ปฏิเสธคำขอ: " + String(parsed.error) + " - ตรวจว่า GAS_EXPORTER_URL ลงท้าย ?token=รหัสลับ และตรงกับ SECRET_TOKEN ใน Apps Script");
            }
            if (!Array.isArray(parsed)) {
              fail("โครงสร้างข้อมูลจาก GAS ไม่ใช่รายการ (array)");
            }
            if (parsed.length === 0) {
              console.warn("WARN: ข้อมูลจาก GAS เป็นรายการว่าง");
            }
            console.log("จำนวนแถวข้อมูล: " + parsed.length);
            console.log("ได้ข้อมูล " + Buffer.byteLength(body, "utf8") + " bytes");

            const payload = encrypt(body, password);
            if (!verify(payload, password, body)) fail("ตรวจสอบถอดรหัสไม่ผ่าน - ไม่เขียนไฟล์");

            fs.writeFileSync("data.json.tmp", JSON.stringify(payload));
            fs.renameSync("data.json.tmp", "data.json");
            console.log("Encryption and data save successful.");
          }

          main().catch(function (err) { fail(err && err.message ? err.message : String(err)); });
          EOF
          node "$RUNNER_TEMP/export-encrypt.js"

      # จะรันก็ต่อเมื่อ step ก่อนหน้าสำเร็จเท่านั้น
      # ถ้าดึงข้อมูลไม่ได้ จะไม่ deploy ทับข้อมูลเดิมบนเว็บ
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,scripts'
