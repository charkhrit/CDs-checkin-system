name: Sync and Encrypt Master Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# กันรันซ้อนกัน: ถ้ารอบก่อนยังไม่จบ รอบใหม่จะรอคิว
concurrency:
  group: sync-master-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and Encrypt Data
        env:
          GAS_EXPORTER_URL: ${{ secrets.GAS_EXPORTER_URL }}
          GAS_EXPORTER_TOKEN: ${{ secrets.GAS_EXPORTER_TOKEN }}
          MASTER_PASSPHRASE: ${{ secrets.MASTER_PASSPHRASE }}
        run: node scripts/export-encrypt.js

      # จะรันก็ต่อเมื่อ step ก่อนหน้าสำเร็จเท่านั้น
      # ถ้าดึงข้อมูลไม่ได้ จะไม่ deploy ทับข้อมูลเดิมบนเว็บ
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,scripts'
