name: Sync and Encrypt Master Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and Encrypt Data
        env:
          GAS_EXPORTER_URL: ${{ secrets.GAS_EXPORTER_URL }}
          MASTER_PASSPHRASE: ${{ secrets.MASTER_PASSPHRASE }}
        run: |
          node -e '
          const crypto = require("crypto");
          const fs = require("fs");
          const https = require("https");

          const url = process.env.GAS_EXPORTER_URL;
          const password = process.env.MASTER_PASSPHRASE;

          https.get(url, (res) => {
            if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
              https.get(res.headers.location, (res2) => {
                let body = "";
                res2.on("data", (chunk) => body += chunk);
                res2.on("end", () => processData(body));
              });
            } else {
              let body = "";
              res.on("data", (chunk) => body += chunk);
              res.on("end", () => processData(body));
            }

            function processData(dataStr) {
              const salt = crypto.randomBytes(16);
              const iv = crypto.randomBytes(12);
              const key = crypto.pbkdf2Sync(password, salt, 100000, 32, "sha256");
              
              const cipher = crypto.createCipheriv("aes-256-gcm", key, iv);
              let encrypted = cipher.update(dataStr, "utf8", "hex");
              encrypted += cipher.final("hex");
              const authTag = cipher.getAuthTag().toString("hex");

              const payload = { salt: salt.toString("hex"), iv: iv.toString("hex"), authTag: authTag, ciphertext: encrypted };
              fs.writeFileSync("data.json", JSON.stringify(payload));
              console.log("Encryption and data save successful.");
            }
          });
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github'
