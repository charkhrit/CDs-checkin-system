<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบเช็กอินวันเด็กแห่งชาติ บน.46</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root { --primary: #0284c7; --bg: #f8fafc; --surface: #ffffff; --text: #1e293b; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .card { background: var(--surface); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); width: 100%; max-width: 500px; text-align: center; box-sizing: border-box; }
    h2 { margin-top: 0; color: var(--primary); font-size: 1.5rem; }
    input[type="password"], select { width: 100%; padding: 14px; margin-bottom: 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 18px; text-align: center; box-sizing: border-box; }
    button.btn-primary { background: var(--primary); color: white; border: none; padding: 14px 24px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; box-sizing: border-box; }
    button.btn-primary:active { background: #0369a1; transform: scale(0.98); }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 16px; background: #f1f5f9; }
    #reader button { padding: 10px 18px; margin: 6px; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; font-size: 15px; }
    #reader select { padding: 10px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #cbd5e1; width: 90%; font-size: 15px; }
    
    #result-box { margin-top: 16px; padding: 20px; border-radius: 10px; display: none; text-align: left; font-size: 1.2rem; line-height: 1.7; transition: all 0.3s ease; }
    .success { background: #dcfce7; color: #166534; border: 2px solid #22c55e; }
    .error { background: #fee2e2; color: #991b1b; border: 2px solid #ef4444; }
    .warning { background: #fef08a; color: #854d0e; border: 2px solid #eab308; }
    
    .status-indicator { display: flex; align-items: center; font-weight: bold; font-size: 1.3rem; margin-bottom: 8px; }
    .dot { height: 16px; width: 16px; border-radius: 50%; display: inline-block; margin-right: 10px; box-shadow: 0 0 8px rgba(0,0,0,0.2); }
    
    .dot-green { background-color: #22c55e; animation: pulse-green 1.5s infinite; }
    .dot-red { background-color: #ef4444; animation: pulse-red 1.5s infinite; }
    .dot-yellow { background-color: #eab308; animation: pulse-yellow 1.5s infinite; }

    @keyframes pulse-green { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
    @keyframes pulse-red { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    @keyframes pulse-yellow { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(234, 179, 8, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); } }

    .log-entry { font-family: monospace; font-size: 14px; margin: 6px 0; border-bottom: 1px dashed #e2e8f0; padding-bottom: 6px; }

    /* ปุ่มเสริมควบคุมหน้างาน */
    .btn-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; }
    .btn-sync-now { background: #0284c7; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; }
    .btn-clear-cache { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card" id="auth-section">
    <h2>🔒 กรุณายืนยันตัวตน</h2>
    <p style="font-size: 15px; color: #64748b;">ระบบสแกนเช็กอินภาคสนาม</p>
    
    <select id="station-select">
      <option value="Scanner_1">จุดสแกนที่ 1</option>
      <option value="Scanner_2">จุดสแกนที่ 2</option>
      <option value="Scanner_3">จุดสแกนที่ 3</option>
      <option value="Scanner_4">จุดสแกนที่ 4</option>
      <option value="Scanner_5">จุดสแกนที่ 5</option>
      <option value="Scanner_6">จุดสแกนที่ 6</option>
      <option value="Scanner_7">จุดสแกนที่ 7</option>
      <option value="Scanner_8">จุดสแกนที่ 8</option>
      <option value="Scanner_9">จุดสแกนที่ 9</option>
      <option value="Scanner_10">จุดสแกนที่ 10</option>
    </select>

    <input type="password" id="passphrase" placeholder="ใส่รหัสผ่านประจำสถานี" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="btn-primary" onclick="initSystem()">ปลดล็อกระบบ</button>
    <div id="auth-status" style="margin-top: 16px; color: #64748b; font-size: 15px;"></div>
  </div>

  <div class="card" id="scanner-section" style="display:none;">
    <h2>📷 สแกนรหัสคิวอาร์</h2>
    
    <!-- แถบควบคุม: เวลาซิงค์, ปุ่มรีเฟรช, และปุ่มล้างแคชเครื่อง -->
    <div class="btn-group">
      <span style="color: #0284c7; font-weight: bold;">🕒 <span id="sync-time">-</span></span>
      <div>
        <button class="btn-sync-now" onclick="manualForceSync()">⚡ รีเฟรช</button>
        <button class="btn-clear-cache" onclick="clearLocalCache()">🗑️ ล้างขยะ</button>
      </div>
    </div>

    <div id="reader"></div>
    <div id="result-box"></div>
    <h3 style="margin-top: 20px; font-size: 16px; text-align: left; border-bottom: 1px solid #eee; padding-bottom: 8px;">ประวัติการสแกนล่าสุด:</h3>
    <div id="recent-logs" style="text-align: left; max-height: 200px; overflow-y: auto;"></div>
  </div>

<script>
// URL ของ Web App คุณ (อัปเดตเรียบร้อย)
const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxOWoamw4coVRUwr2JINdfBQL48c7xgPt3Cd0AcA76FDjxxRnWoWXLAnY9-Zqa-0jUZFg/exec";

let localDatabaseMap = new Map();
let isProcessing = false;
let scannerInstance = null;
let currentStation = "Scanner_Unknown";
let scannedSet = new Set(JSON.parse(localStorage.getItem("scannedSet") || "[]"));

let savedPassphrase = "";
let autoSyncInterval = null;

function hexToBytes(hex) { return new Uint8Array(hex.match(/.{1,2}/g).map(b => parseInt(b, 16))); }

async function deriveKey(passphrase, saltHex) {
  const enc = new TextEncoder();
  const salt = hexToBytes(saltHex);
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  return await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
}

async function decryptPayload(payload, passphrase) {
  const key = await deriveKey(passphrase, payload.salt);
  const cipherWithTag = new Uint8Array(hexToBytes(payload.ciphertext).length + hexToBytes(payload.authTag).length);
  cipherWithTag.set(hexToBytes(payload.ciphertext));
  cipherWithTag.set(hexToBytes(payload.authTag), hexToBytes(payload.ciphertext).length);
  const decryptedBuffer = await crypto.subtle.decrypt({ name: "AES-GCM", iv: hexToBytes(payload.iv), tagLength: 128 }, key, cipherWithTag);
  return JSON.parse(new TextDecoder().decode(decryptedBuffer));
}

async function initSystem() {
  const passphrase = document.getElementById("passphrase").value.trim();
  currentStation = document.getElementById("station-select").value; 
  const statusEl = document.getElementById("auth-status");
  
  if (!passphrase) { statusEl.innerText = "⚠️ กรุณาพิมพ์รหัสผ่าน"; return; }
  
  statusEl.innerText = "⏳ กำลังดาวน์โหลดข้อมูล...";
  
  try {
    const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("ไม่พบไฟล์ข้อมูล (HTTP " + res.status + ")");
    const payload = await res.json();
    if (!payload || !payload.salt) throw new Error("ไฟล์ไม่อยู่ในรูปแบบเข้ารหัส");
    
    statusEl.innerText = "🔐 กำลังถอดรหัสข้อมูล...";
    let rawData = await decryptPayload(payload, passphrase);

    if (rawData && !Array.isArray(rawData)) {
      if (rawData.error) throw new Error("GAS ปฏิเสธคำขอ: " + rawData.error);
      rawData = rawData.data || rawData.rows || rawData.records;
    }
    if (!Array.isArray(rawData)) throw new Error("ข้อมูลไม่ใช่รายการ (array)");
    
    localDatabaseMap.clear();
    rawData.forEach(item => {
      let keys = Object.keys(item);
      let uidKey = keys.find(k => ['ID', 'UID'].includes(k.trim().toUpperCase())) || keys[0];
      localDatabaseMap.set(String(item[uidKey]).trim(), item);
    });
    
    savedPassphrase = passphrase;
    document.getElementById("sync-time").innerText = new Date().toLocaleTimeString('th-TH');

    document.getElementById("auth-section").style.display = "none";
    document.getElementById("scanner-section").style.display = "block";
    
    startScanner();

    if (!autoSyncInterval) {
      autoSyncInterval = setInterval(syncDataBackground, 30000);
    }
    
  } catch (err) {
    statusEl.innerHTML = `<span style="color:red">❌ ${err.message}</span>`;
    document.getElementById("passphrase").value = "";
  }
}

async function syncDataBackground() {
  if (!savedPassphrase) return;
  try {
    const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    
    const payload = await res.json();
    let rawData = await decryptPayload(payload, savedPassphrase);
    
    if (rawData && !Array.isArray(rawData)) rawData = rawData.data || rawData.rows || rawData.records;
    if (!Array.isArray(rawData)) return;

    let newDatabaseMap = new Map();
    rawData.forEach(item => {
      let keys = Object.keys(item);
      let uidKey = keys.find(k => ['ID', 'UID'].includes(k.trim().toUpperCase())) || keys[0];
      newDatabaseMap.set(String(item[uidKey]).trim(), item);
    });
    
    localDatabaseMap = newDatabaseMap;
    document.getElementById("sync-time").innerText = new Date().toLocaleTimeString('th-TH');

    // 👉 Garbage Collection: ล้างตัวแปรขยะในหน่วยความจำเบราว์เซอร์อัตโนมัติ
    if (window.gc) window.gc();

  } catch (err) {
    console.error("[Sync Error]:", err);
  }
}

async function manualForceSync() {
  document.getElementById("sync-time").innerText = "กำลังรีเฟรช...";
  await syncDataBackground();
  if (autoSyncInterval) {
    clearInterval(autoSyncInterval);
    autoSyncInterval = setInterval(syncDataBackground, 30000);
  }
}

// 👉 ฟังก์ชันล้างประวัติขยะและหน่วยความจำของเครื่อง (Clear Cache & DOM Logs)
function clearLocalCache() {
  if (confirm("⚠️ คุณต้องการล้างประวัติและข้อมูลขยะในเครื่องนี้ใช่หรือไม่?\n(ประวัติการสแกนบนหน้าจอจะถูกเคลียร์เพื่อลดการกินแรม)")) {
    // 1. ล้างกล่องแสดงผล Logs บนหน้าจอไม่ให้ DOM บวม
    const recentLogs = document.getElementById("recent-logs");
    recentLogs.innerHTML = "";
    
    // 2. ล้างข้อมูลขยะใน RAM Map ชั่วคราว
    localDatabaseMap.clear();

    // 3. แจ้งเตือนและบังคับดึงข้อมูลใหม่ทันที
    alert("🧹 เคลียร์ข้อมูลขยะเรียบร้อยแล้ว ระบบกำลังดึงข้อมูลสดใหม่อีกครั้ง");
    manualForceSync();
  }
}

function startScanner() {
  let qrboxSize = window.innerWidth < 400 ? 220 : 260;
  scannerInstance = new Html5QrcodeScanner("reader", { 
    fps: 10, qrbox: { width: qrboxSize, height: qrboxSize }, aspectRatio: 1.0, rememberLastUsedCamera: true
  });
  scannerInstance.render(onScanSuccess);
}

function maskIdCard(id) {
  if (!id) return "-";
  let s = String(id).trim();
  if (s.length >= 10) return s.substring(0, 4) + "xxxxxx" + s.substring(10);
  return s;
}

function maskPhone(phone) {
  if (!phone) return "-";
  let s = String(phone).trim();
  if (s.length >= 2) return "xxxxxxxx" + s.slice(-2);
  return s;
}

function onScanSuccess(decodedText) {
  if (isProcessing) return;
  isProcessing = true;
  
  const uid = String(decodedText).trim();
  const resBox = document.getElementById("result-box");
  const recentLogs = document.getElementById("recent-logs");
  
  if (localDatabaseMap.has(uid)) {
    const record = localDatabaseMap.get(uid);
    const name = record["ชื่อ"] || "-";
    const surname = record["นามสกุล"] || "";
    const rawId = record["เลขบัตรประชาชน"] || "";
    const rawPhone = record["เบอร์โทรศัพท์"] || "";
    const carPlate = record["ทะเบียนรถ"] || "-";
    const countPeople = record["จำนวนคน"] || "1";
    
    const isLocalScanned = scannedSet.has(uid);
    const isServerScanned = record["_isScanned"] === true || record["_isScanned"] === "true";

    if (isLocalScanned || isServerScanned) {
      resBox.className = "warning";
      resBox.innerHTML = `
        <div class="status-indicator"><span class="dot dot-yellow"></span> สแกนซ้ำ (เช็กอินแล้ว)</div>
        <hr style="margin: 8px 0; border:0; border-top:1px solid #fde047;">
        👤 <b>ชื่อ-นามสกุล:</b> ${name} ${surname}<br>
        <div style="margin-top: 10px; padding: 10px; background: #fef9c3; border: 1px dashed #ca8a04; border-radius: 6px; text-align: center;">
          <span style="font-size: 1.1rem; color: #b45309; font-weight: bold;">⚠️ คิวอาร์โค้ดนี้มีการลงทะเบียนไปแล้ว</span><br>
          <span style="font-size: 1.2rem; color: #dc2626; font-weight: bold; display: block; margin-top: 5px;">🛑 กรุณาติดต่อเจ้าหน้าที่!</span>
        </div>
      `;
      resBox.style.display = "block";
      addLog(`⚠️ ${uid} - สแกนซ้ำ (${name})`, recentLogs);
      sendLogAsync(uid, "DUPLICATE"); 
      
    } else {
      scannedSet.add(uid);
      localStorage.setItem("scannedSet", JSON.stringify(Array.from(scannedSet)));
      
      resBox.className = "success";
      resBox.innerHTML = `
        <div class="status-indicator"><span class="dot dot-green"></span> พบข้อมูลในระบบ (สำเร็จ)</div>
        <hr style="margin: 8px 0; border:0; border-top:1px solid #bbf7d0;">
        👤 <b>ชื่อ-นามสกุล:</b> ${name} ${surname}<br>
        🆔 <b>เลขบัตรประชาชน:</b> ${maskIdCard(rawId)}<br>
        📞 <b>เบอร์โทรศัพท์:</b> ${maskPhone(rawPhone)}<br>
        🚗 <b>ทะเบียนรถ:</b> ${carPlate}<br>
        👥 <b>จำนวนคน:</b> ${countPeople} ท่าน
      `;
      resBox.style.display = "block";
      addLog(`✅ ${uid} - ${name} ${surname}`, recentLogs);
      sendLogAsync(uid, "SUCCESS");
    }
  } else {
    resBox.className = "error";
    resBox.innerHTML = `
      <div class="status-indicator"><span class="dot dot-red"></span> ไม่พบข้อมูลในระบบ</div>
      <hr style="margin: 8px 0; border:0; border-top:1px solid #fecaca;">
      รหัสที่สแกน: <b>${uid}</b><br>
      <span style="font-size: 1rem; color: #b91c1c;">กรุณาตรวจสอบรายชื่อใหม่อีกครั้ง</span>
    `;
    resBox.style.display = "block";
    addLog(`❌ ${uid} - ไม่พบข้อมูล`, recentLogs);
    sendLogAsync(uid, "NOT_FOUND");
  }
  
  setTimeout(() => {
    isProcessing = false;
    resBox.style.display = "none";
  }, 5000); 
}

function addLog(text, container) {
  const timeStr = new Date().toLocaleTimeString('th-TH');
  const div = document.createElement("div");
  div.className = "log-entry";
  div.innerText = `[${timeStr}] ${text}`;
  container.prepend(div);

  // 👉 ป้องกันหน่วยความจำบวม: หากประวัติแสดงผลเกิน 50 รายการ ให้ตัดรายการเก่าสุดทิ้งทันที
  const maxLogs = 50;
  while (container.children.length > maxLogs) {
    container.removeChild(container.lastChild);
  }
}

function sendLogAsync(uid, status) {
  // แก้ไขระบบตรวจสอบ URL เพื่อรองรับลิงก์ของ Google Apps Script
  if (!GAS_WEBAPP_URL || !GAS_WEBAPP_URL.includes("script.google.com")) {
    console.warn("GAS URL ไม่ถูกต้อง ข้อมูลจะไม่ถูกส่งไปยังเซิร์ฟเวอร์");
    return;
  }
  
  fetch(GAS_WEBAPP_URL, {
    method: "POST",
    mode: "no-cors",
    redirect: "follow",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ uid: uid, stationId: currentStation, status: status }) 
  }).catch(err => console.error("Error sending log:", err));
}
</script>
</body>
</html>
